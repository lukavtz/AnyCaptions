[package]
name = "anycaptions-ui"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anycaptions-core = { path = "../anycaptions-core" }
anycaptions-platform-win32 = { path = "../anycaptions-platform-win32" }
async-channel = "2.5.0"
gpui = { version = "=0.2.2", default-features = false }
raw-window-handle = "0.6"
unicode-segmentation = "1.13.3"

[dev-dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["test-support"] }
