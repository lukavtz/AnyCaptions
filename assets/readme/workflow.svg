<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Audio stays local. Captions follow.</title>
  <desc id="desc">Three steps show audio from any Windows application becoming live captions and translation entirely on-device.</desc>
  <rect width="1200" height="190" rx="24" fill="#080b12"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="56" y="46" fill="#f1f5f9" font-size="30" font-weight="600">Audio stays local. Captions follow.</text>
    <text x="56" y="76" fill="#7d93b5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">NO CLOUD • NO ACCOUNT • NO HISTORY</text>

    <g transform="translate(56 105)">
      <circle cx="18" cy="18" r="18" fill="#172554" stroke="#60a5fa"/>
      <path d="M11 18h14M18 11v14" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
      <text x="52" y="16" fill="#e2e8f0" font-size="23" font-weight="600">1. Listen to any app</text>
      <text x="52" y="42" fill="#94a3b8" font-size="18">System audio, already playing.</text>
    </g>
    <path d="M380 123h64" stroke="#3157a6" stroke-width="2"/>
    <path d="M436 123l-8-6v12z" fill="#60a5fa"/>

    <g transform="translate(460 105)">
      <circle cx="18" cy="18" r="18" fill="#172554" stroke="#60a5fa"/>
      <rect x="10" y="10" width="16" height="14" rx="3" fill="none" stroke="#93c5fd" stroke-width="2"/>
      <path d="M13 17h10" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
      <text x="52" y="16" fill="#e2e8f0" font-size="23" font-weight="600">2. See live captions</text>
      <text x="52" y="42" fill="#94a3b8" font-size="18">Live words in a topmost overlay.</text>
    </g>
    <path d="M788 123h64" stroke="#3157a6" stroke-width="2"/>
    <path d="M844 123l-8-6v12z" fill="#60a5fa"/>

    <g transform="translate(864 105)">
      <circle cx="18" cy="18" r="18" fill="#312e81" stroke="#a78bfa"/>
      <path d="M11 15h14M11 21h14M14 11v14M22 11v14" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
      <text x="52" y="16" fill="#e2e8f0" font-size="23" font-weight="600">3. Translate on-device</text>
      <text x="52" y="42" fill="#94a3b8" font-size="18">NeMo + OPUS-MT.</text>
    </g>
  </g>
</svg>
